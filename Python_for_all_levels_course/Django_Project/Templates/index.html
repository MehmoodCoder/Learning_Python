{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e4e1e1;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: navy;
        }
        p {
            color: #333;
        }
        div {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input , textarea{
            margin-top: 20px;
            border-color: black;
            border-width: 2px;
            border-style: solid;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            padding: 10px;
        }
        input.submit{
            background-color: navy;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            border-color: black;
            border-radius: 20px;
            padding: 5px 10px;
        }
        input.submit:hover{
            background-color: #333;
        }
        h6{
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            color:rgb(36, 35, 35);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        <h1>Welcome to My Website</h1>
        <p>This is the home page of my Django project.</p>
        <p>I am from HTML</p><br>
        {{ key }}<br><br>
        <center>
            <h1>BMW M4</h1>
            <img src="{% static 'BMW.jpg' %}" alt="BMW M4" width="auto" height="auto">
            <img src="{% static 'BMW.jpg' %}" alt="BMW M4" width="auto" height="auto">
        </center>
        <a href="{% url 'result' %}">View Result</a>
    </div>
    <br><br>
    <div>
        <!-- for security -->
        <!-- <form action="{% url 'result' %}">
            {% csrf_token %} 
            <input type="text" name="name" placeholder="Enter your name"><br>
            <input class = "submit" type="submit" value="Submit">
        </form> -->
        
        <br>

        <form action="{% url 'result' %}">
            {% csrf_token %} 
            <!-- for security -->
             <h6>Enter your message :</h6>
            <textarea style="resize: none;" name="message" cols = "60" rows ="10" id="message" placeholder="Enter your message here..."></textarea><br>
            <input class = "submit" type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
