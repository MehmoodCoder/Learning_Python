<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dad8d8;
            margin: 0;
            padding: 20px;
        }
        h1.h1 {
            color: black;
            font-size: 2cap;
        }
        h1{
            color: red;
            font-size: 2cap;
        }
        div {
            background-color: white;
            padding: 20px;
            color: black;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div>
        <!-- <h1 class="h1">Your Result</h1><br>
        <center>
            <h1>You are fail !!!</h1>
        </center> -->
        
        <a href="{% url 'home' %}">Go Back to Home page</a><br><br>

        <h5>Your message is {{message}}</h5>
        <h5>Word Count: {{word_count}}</h5>

        {% for word, frequency in dict_words %}
            <p>{{ word }}: {{ frequency }}</p>
        {% endfor %}

    </div>
</body>
</html>
